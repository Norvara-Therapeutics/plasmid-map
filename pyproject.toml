[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "norvara-plasmid-map"
version = "1.0.0rc2"
description = "Circular plasmid maps and linear feature tracks as standalone SVG, from no third-party dependencies"
readme = "README.md"
requires-python = ">=3.10"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
authors = [
    { name = "Norvara Therapeutics", email = "research@norvaratx.com" },
]
maintainers = [
    { name = "Norvara Therapeutics", email = "research@norvaratx.com" },
]
keywords = ["bioinformatics", "plasmid-map", "genbank", "svg", "sequence-annotation", "molecular-cloning"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Multimedia :: Graphics",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Norvara-Therapeutics/plasmid-map"
Repository = "https://github.com/Norvara-Therapeutics/plasmid-map.git"
Issues = "https://github.com/Norvara-Therapeutics/plasmid-map/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "pyflakes>=3", "build>=1", "setuptools>=77", "tomli>=2; python_version < '3.11'"]

[project.scripts]
plasmid-map = "plasmid_map.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
plasmid_map = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
